<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>AI Blog Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/styles.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            mono: ['Space Grotesk', 'monospace'],
          },
          colors: {
            neon: {
              green: '#00ffa3',
              purple: '#b026ff',
            }
          }
        }
      }
    }
  </script>
</head>

<body class="bg-black text-white min-h-screen relative overflow-x-hidden selection:bg-emerald-500 selection:text-black">
  <div class="fixed inset-0 pointer-events-none z-[-1]"
    style="background: radial-gradient(circle at 50% 10%, rgba(0, 255, 163, 0.1), transparent 40%), radial-gradient(circle at 90% 90%, rgba(176, 38, 255, 0.08), transparent 40%);">
  </div>

  <nav class="border-b border-zinc-800 p-4 sticky top-0 bg-black/50 backdrop-blur-xl z-[100]">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="/" class="text-xl font-bold flex items-center gap-2 hover:scale-[1.02] transition-transform">
        <span class="text-2xl text-[#00ffa3]">✨</span>
        <span>AI Blog <span class="text-[#00ffa3]">Generator</span></span>
      </a>

      <div id="nav-auth" class="flex items-center gap-6">
        <!-- Will be populated by auth.js -->
        <a href="/login" class="text-sm font-bold text-zinc-400 hover:text-white transition-colors">Login</a>
        <a href="/signup"
          class="bg-gradient-to-r from-[#00ffa3] to-emerald-600 text-black px-6 py-2 rounded-lg text-sm font-black hover:scale-[1.05] transition-all">Sign
          Up</a>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto p-6">
    {% block content %}{% endblock %}
  </main>

  <!-- Firebase App (the core Firebase SDK) is always required and must be listed first -->
  <script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore-compat.js"></script>
  <script>
    window.FIREBASE_CONFIG = {{ firebase_config | tojson }};
  </script>
  <script src="/static/js/auth.js"></script>

  <script src="https://cdn.ckeditor.com/4.22.1/standard/ckeditor.js"></script>
  <script src="/static/js/main.js"></script>
  {% block scripts %}{% endblock %}
</body>

</html>
