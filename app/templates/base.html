<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Blog Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/styles.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            mono: ['Space Grotesk', 'monospace'],
          },
          colors: {
            neon: {
              green: '#00ffa3',
              purple: '#b026ff',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-black text-white min-h-screen relative overflow-x-hidden selection:bg-emerald-500 selection:text-black">
  <div class="fixed inset-0 pointer-events-none z-[-1]" style="background: radial-gradient(circle at 50% 10%, rgba(0, 255, 163, 0.1), transparent 40%), radial-gradient(circle at 90% 90%, rgba(176, 38, 255, 0.08), transparent 40%);"></div>

  <nav class="border-b border-zinc-800 p-4 text-xl font-semibold">
    ✨ AI Blog Generator
  </nav>

  <main class="max-w-6xl mx-auto p-6">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.ckeditor.com/4.22.1/standard/ckeditor.js"></script>
  <script src="/static/js/main.js"></script>
</body>
</html>
