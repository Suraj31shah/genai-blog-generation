{% extends "base.html" %}

{% block content %}
<section class="min-h-[80vh] flex items-center justify-center py-10">
    <div class="glass p-10 rounded-3xl shadow-2xl w-full max-w-md space-y-8 animate-float"
        style="animation-duration: 10s;">

        <div class="text-center space-y-2">
            <h2 class="text-4xl font-bold tracking-tight">Create <span class="text-[#00ffa3]">Account</span></h2>
            <p class="text-zinc-400 font-mono text-sm">Join the next generation of content creators.</p>
        </div>

        <form id="signup-form" class="space-y-5">
            <div class="space-y-2">
                <label class="text-xs font-bold text-cyan-400 tracking-widest uppercase block">Username</label>
                <input id="signup-username" type="text" required
                    class="w-full bg-black/50 border border-zinc-800 rounded-xl p-4 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all text-white placeholder-zinc-700"
                    placeholder="creator_99" />
            </div>

            <div class="space-y-2">
                <label class="text-xs font-bold text-[#00ffa3] tracking-widest uppercase block">Email Address</label>
                <input id="signup-email" type="email" required
                    class="w-full bg-black/50 border border-zinc-800 rounded-xl p-4 focus:outline-none focus:border-[#00ffa3] focus:ring-1 focus:ring-[#00ffa3] transition-all text-white placeholder-zinc-700"
                    placeholder="name@example.com" />
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-2">
                    <label class="text-xs font-bold text-[#b026ff] tracking-widest uppercase block">Password</label>
                    <input id="signup-password" type="password" required
                        class="w-full bg-black/50 border border-zinc-800 rounded-xl p-4 focus:outline-none focus:border-[#b026ff] focus:ring-1 focus:ring-[#b026ff] transition-all text-white placeholder-zinc-700"
                        placeholder="••••••••" />
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold text-[#b026ff] tracking-widest uppercase block">Confirm</label>
                    <input id="signup-confirm" type="password" required
                        class="w-full bg-black/50 border border-zinc-800 rounded-xl p-4 focus:outline-none focus:border-[#b026ff] focus:ring-1 focus:ring-[#b026ff] transition-all text-white placeholder-zinc-700"
                        placeholder="••••••••" />
                </div>
            </div>

            <div id="signup-error"
                class="hidden text-red-500 text-sm font-medium bg-red-500/10 p-3 rounded-lg border border-red-500/20">
                <!-- Error message will be injected here -->
            </div>

            <button type="submit"
                class="group w-full relative bg-gradient-to-r from-[#00ffa3] to-emerald-600 text-black font-black text-lg py-4 rounded-xl transition-all hover:scale-[1.02] active:scale-[0.98] overflow-hidden">
                <span class="relative z-10">CREATE ACCOUNT</span>
                <div
                    class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300">
                </div>
            </button>
        </form>

        <div class="text-center">
            <p class="text-zinc-500 text-sm">
                Already have an account?
                <a href="/login" class="text-[#00ffa3] font-bold hover:underline">Log in instead</a>
            </p>
        </div>

    </div>
</section>

<script>
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('signup-username').value;
        const email = document.getElementById('signup-email').value;
        const password = document.getElementById('signup-password').value;
        const confirm = document.getElementById('signup-confirm').value;
        const errorEl = document.getElementById('signup-error');

        errorEl.classList.add('hidden');

        if (password !== confirm) {
            errorEl.textContent = "Passwords do not match.";
            errorEl.classList.remove('hidden');
            return;
        }

        if (password.length < 6) {
            errorEl.textContent = "Password should be at least 6 characters.";
            errorEl.classList.remove('hidden');
            return;
        }

        try {
            const userCredential = await firebase.auth().createUserWithEmailAndPassword(email, password);
            const user = userCredential.user;

            // Update display name (Username)
            await user.updateProfile({
                displayName: username
            });

            // Store in Firestore for professional edge cases
            const db = firebase.firestore();
            await db.collection('users').doc(user.uid).set({
                username: username,
                email: email,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            window.location.href = '/';
        } catch (error) {
            console.error(error);
            if (error.code === 'auth/email-already-in-use') {
                errorEl.textContent = "This email is already registered. Please log in.";
            } else {
                errorEl.textContent = error.message;
            }
            errorEl.classList.remove('hidden');
        }
    });
</script>
{% endblock %}
